name: Print GitHub Secrets

on:
  push:

jobs:
  print_secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Debug single line Secret in Variable
        run: echo ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN}} | sed 's/./& /g'
      
      - name: Debug Multi-line Secret in Variable
        run: |
          HEREDOC_VARIABLE=$(cat << 'EOF'
          ${{ secrets.MULTI_LINE_SECRET}}
          EOF
          )
          while IFS= read -r line; do
            echo "Line: $line" | sed 's/./& /g'
          done <<< "$HEREDOC_VARIABLE"
